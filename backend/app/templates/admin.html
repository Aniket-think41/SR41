<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillShare Admin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f0f13;color:#e0e0e0;display:flex;height:100vh;overflow:hidden}
.sidebar{width:240px;background:#1a1a24;border-right:1px solid #2a2a3a;overflow-y:auto;flex-shrink:0}
.sidebar h1{padding:20px 16px;font-size:16px;font-weight:600;color:#735ae5;border-bottom:1px solid #2a2a3a}
.sidebar h1 span{color:#d1ff00}
.sidebar .table-list{padding:8px 0}
.sidebar .table-item{padding:8px 16px;cursor:pointer;font-size:13px;color:#999;transition:all .15s}
.sidebar .table-item:hover{color:#e0e0e0;background:#2a2a3a}
.sidebar .table-item.active{color:#735ae5;background:#2a2a3a;font-weight:600}
.main{flex:1;overflow-y:auto;padding:24px}
.main h2{font-size:20px;font-weight:600;margin-bottom:4px}
.main .subtitle{color:#666;font-size:13px;margin-bottom:20px}
.search-bar{margin-bottom:16px;display:flex;gap:12px;align-items:center}
.search-bar input{padding:8px 12px;border-radius:6px;border:1px solid #2a2a3a;background:#1a1a24;color:#e0e0e0;font-size:13px;flex:1;max-width:320px;outline:none}
.search-bar input:focus{border-color:#735ae5}
.search-bar .count{color:#666;font-size:13px}
.stats{margin-bottom:20px}
.stats .stat{display:inline-block;margin-right:16px;padding:6px 12px;background:#1a1a24;border-radius:6px;font-size:12px;color:#999}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;background:#1a1a24;color:#999;font-weight:600;border-bottom:2px solid #2a2a3a;cursor:pointer;white-space:nowrap;position:sticky;top:0}
th:hover{color:#e0e0e0}
td{padding:8px 12px;border-bottom:1px solid #1a1a24;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:top}
tr:hover td{background:#1a1a24}
.id{color:#735ae5;font-family:'SF Mono',Consolas,monospace;font-size:12px}
.bool-true{color:#4ade80}
.bool-false{color:#f87171}
.null{color:#555;font-style:italic}
.json-preview{color:#fbbf24;font-family:'SF Mono',Consolas,monospace;font-size:12px;cursor:help}
.pagination{display:flex;gap:8px;align-items:center;margin-top:16px;justify-content:center}
.pagination button{padding:6px 14px;border-radius:6px;border:1px solid #2a2a3a;background:#1a1a24;color:#e0e0e0;cursor:pointer;font-size:13px}
.pagination button:hover{background:#2a2a3a;border-color:#735ae5}
.pagination button:disabled{opacity:.4;cursor:default;border-color:#2a2a3a}
.pagination .page-info{color:#666;font-size:13px}
.row-detail{display:none;background:#1a1a24}
.row-detail.show{display:table-row}
.row-detail td{padding:16px;white-space:pre-wrap;max-width:none;font-family:'SF Mono',Consolas,monospace;font-size:12px;color:#999;line-height:1.5}
.expand-btn{cursor:pointer;color:#735ae5;font-size:11px;margin-left:4px;opacity:.6}
.expand-btn:hover{opacity:1}
.loading{text-align:center;padding:60px;color:#666}
.error{text-align:center;padding:60px;color:#f87171}
.tabs{margin-bottom:0;display:flex;gap:0;border-bottom:1px solid #2a2a3a;margin-bottom:16px}
.tab{padding:8px 16px;cursor:pointer;font-size:13px;color:#666;border-bottom:2px solid transparent;transition:all .15s}
.tab:hover{color:#e0e0e0}
.tab.active{color:#735ae5;border-bottom-color:#735ae5}
</style>
</head>
<body>
<div class="sidebar">
  <h1>Skill<span>Share</span> Admin</h1>
  <div class="table-list" id="tableList"></div>
</div>
<div class="main" id="mainContent">
  <div class="loading">Select a table from the sidebar</div>
</div>
<script>
const BASE = '/api/admin/tables';
let currentTable = '';
let currentData = [];
let currentPage = 1;
const PER_PAGE = 50;
let currentFilter = '';

function qs(sel) { return document.querySelector(sel); }

function escapeHtml(str) {
  if (str == null) return '<span class="null">NULL</span>';
  const s = String(str);
  if (s.length > 200) return escapeHtml(s.slice(0,200)) + '…';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function formatCell(val) {
  if (val === null || val === undefined) return '<span class="null">NULL</span>';
  if (typeof val === 'boolean') return `<span class="bool-${val}">${val}</span>`;
  if (typeof val === 'object') return `<span class="json-preview" onclick="alert(JSON.stringify(${JSON.stringify(JSON.stringify(val))},null,2))">${escapeHtml(JSON.stringify(val).slice(0,100))}</span>`;
  const s = String(val);
  if (typeof val === 'string' && (s.startsWith('u-') || s.startsWith('org-') || s.startsWith('proj-') || s.startsWith('pod-') || s.startsWith('res-') || s.startsWith('inv-') || s.startsWith('om-') || s.startsWith('pm-') || s.startsWith('pdm-') || s.startsWith('act-') || s.startsWith('ntf-') || s.startsWith('fb-') || s.startsWith('blog-') || s.startsWith('chg-') || s.startsWith('of-') || s.startsWith('lic-') || s.startsWith('pat-') || s.startsWith('rt-') || s.startsWith('dev-') || s.startsWith('fol-') || s.startsWith('ofl-') || s.startsWith('st-') || s.startsWith('pin-') || s.startsWith('las-') || s.startsWith('page-'))) {
    return `<span class="id">${escapeHtml(s)}</span>`;
  }
  if (typeof val === 'string' && s.length > 120) return escapeHtml(s.slice(0,120)) + '…';
  return escapeHtml(s);
}

async function loadTables() {
  try {
    const res = await fetch('/api/admin/tables');
    const data = await res.json();
    const list = document.getElementById('tableList');
    list.innerHTML = data.tables.map(t =>
      `<div class="table-item" onclick="selectTable('${t.name}')">${t.name} <span style="color:#555;font-size:11px">(${t.count})</span></div>`
    ).join('');
  } catch(e) {
    document.getElementById('tableList').innerHTML = '<div style="padding:16px;color:#f87171;font-size:13px">Failed to load tables</div>';
  }
}

async function selectTable(name) {
  currentTable = name;
  currentPage = 1;
  currentFilter = '';
  document.querySelectorAll('.table-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.table-item').forEach(el => {
    if (el.textContent.trim().startsWith(name)) el.classList.add('active');
  });
  await loadTableData();
}

function filterData() {
  const val = document.getElementById('searchInput')?.value?.toLowerCase() || '';
  currentFilter = val;
  currentPage = 1;
  renderTable();
}

function getFilteredData() {
  if (!currentFilter) return currentData;
  return currentData.filter(row =>
    Object.values(row).some(v => {
      if (v === null || v === undefined) return false;
      return String(v).toLowerCase().includes(currentFilter);
    })
  );
}

async function loadTableData() {
  const main = document.getElementById('mainContent');
  main.innerHTML = '<div class="loading">Loading…</div>';
  try {
    const res = await fetch(`${BASE}/${currentTable}`);
    const json = await res.json();
    currentData = json.data || [];
    renderTable();
  } catch(e) {
    main.innerHTML = `<div class="error">Failed to load table: ${escapeHtml(e.message)}</div>`;
  }
}

function renderTable() {
  const main = document.getElementById('mainContent');
  const filtered = getFilteredData();
  const totalPages = Math.max(1, Math.ceil(filtered.length / PER_PAGE));
  if (currentPage > totalPages) currentPage = totalPages;
  const start = (currentPage - 1) * PER_PAGE;
  const pageRows = filtered.slice(start, start + PER_PAGE);
  const cols = currentData.length > 0 ? Object.keys(currentData[0]) : [];

  let html = `<h2>${currentTable}</h2>`;
  html += `<div class="subtitle">${currentData.length} rows</div>`;

  html += `<div class="search-bar">
    <input id="searchInput" type="text" placeholder="Filter rows…" oninput="filterData()" value="${escapeHtml(currentFilter)}">
    <span class="count">${filtered.length} / ${currentData.length} rows</span>
  </div>`;

  html += `<table><thead><tr>`;
  cols.forEach(c => { html += `<th onclick="sortBy('${c}')">${c}</th>`; });
  html += `<th style="width:30px"></th></tr></thead><tbody>`;

  pageRows.forEach((row, i) => {
    const idx = start + i;
    html += `<tr onclick="toggleDetail(${idx})" style="cursor:pointer">`;
    cols.forEach(c => { html += `<td>${formatCell(row[c])}</td>`; });
    html += `<td><span class="expand-btn">▶</span></td></tr>`;
    html += `<tr class="row-detail" id="detail-${idx}"><td colspan="${cols.length + 1}">${escapeHtml(JSON.stringify(row, null, 2))}</td></tr>`;
  });

  html += `</tbody></table>`;

  if (totalPages > 1) {
    html += `<div class="pagination">
      <button onclick="goPage(1)" ${currentPage <= 1 ? 'disabled' : ''}>«</button>
      <button onclick="goPage(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''}>‹</button>
      <span class="page-info">Page ${currentPage} of ${totalPages}</span>
      <button onclick="goPage(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled' : ''}>›</button>
      <button onclick="goPage(${totalPages})" ${currentPage >= totalPages ? 'disabled' : ''}>»</button>
    </div>`;
  }

  main.innerHTML = html;
}

function goPage(n) {
  currentPage = n;
  renderTable();
}

let sortAsc = true;
let sortCol = '';
function sortBy(col) {
  if (sortCol === col) sortAsc = !sortAsc;
  else { sortCol = col; sortAsc = true; }
  currentData.sort((a, b) => {
    const va = a[col] ?? '', vb = b[col] ?? '';
    if (typeof va === 'number' && typeof vb === 'number') return sortAsc ? va - vb : vb - va;
    return sortAsc ? String(va).localeCompare(String(vb)) : String(vb).localeCompare(String(va));
  });
  renderTable();
}

function toggleDetail(idx) {
  const el = document.getElementById(`detail-${idx}`);
  if (el) el.classList.toggle('show');
}

loadTables();
</script>
</body>
</html>
