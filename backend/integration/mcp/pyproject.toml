[project]
name = "skillshare-mcp"
version = "0.1.0"
description = "MCP server for the SkillShare registry — search, read, and add skills/MCPs/notes from any MCP client (Claude Code, Claude Desktop, ...)."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2",
    "httpx>=0.27",
]

[project.scripts]
skillshare-mcp = "skillshare_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["skillshare_mcp"]
