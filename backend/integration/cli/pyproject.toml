[project]
name = "skillshare-cli"
version = "0.1.0"
description = "Command-line client for the SkillShare registry — login, search the marketplace, pull skills, add notes, publish."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
skillshare = "skillshare_cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["skillshare_cli", "skillshare_cli.local"]
