# Netlify configuration for the SkillShare marketing site.
# The repo is a monorepo (backend / website / client); this builds website/.

[build]
  # Build from the website/ subdirectory (monorepo).
  base = "website"
  command = "npm run build"
  # Next.js build output, resolved relative to `base` (→ website/.next).
  # Must differ from `base`; declaring it here overrides any UI "Publish
  # directory" value (file config wins over the dashboard).
  publish = ".next"

[build.environment]
  # Next 16 + React 19 need a current Node.
  NODE_VERSION = "20"

# Official Next.js runtime — handles App Router SSR, ISR (revalidate 60),
# Server Actions (marketplace "Load more"), and the redirects() in
# next.config.ts.
[[plugins]]
  package = "@netlify/plugin-nextjs"
